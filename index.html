<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Armenian Transliteration Tool</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 40px;
    max-width: 800px;
  }
  textarea {
    width: 100%;
    height: 100px;
    font-size: 1.1em;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: left;
  }
  th {
    background: #f2f2f2;
  }
</style>
</head>

<body>

<h1>Armenian Transliteration</h1>

<p>Enter Armenian text:</p>
<textarea id="input" oninput="update()"></textarea>

<table>
  <tr><th>Standard</th><th>Transliteration</th></tr>
  <tr><td>LOC (Library of Congress)</td><td id="loc"></td></tr>
  <tr><td>HMB (Hübschmann–Meillet–Benveniste)</td><td id="hmb"></td></tr>
  <tr><td>Passport / ICAO</td><td id="passport"></td></tr>
  <tr><td>ASCII (English letters only)</td><td id="ascii"></td></tr>
</table>

<script>
/* ================= LOC MAP ================= */

const locMap = {
  "Ա":"A","ա":"a","Բ":"B","բ":"b","Գ":"G","գ":"g",
  "Դ":"D","դ":"d","Զ":"Z","զ":"z","Է":"E","է":"e",
  "Ը":"Ë","ը":"ë","Թ":"Tʻ","թ":"tʻ","Ժ":"Zh","ժ":"zh",
  "Ի":"I","ի":"i","Լ":"L","լ":"l","Խ":"Kh","խ":"kh",
  "Ծ":"Ts","ծ":"ts","Կ":"K","կ":"k","Հ":"H","հ":"h",
  "Ձ":"Dz","ձ":"dz","Ղ":"Gh","ղ":"gh","Ճ":"Ch","ճ":"ch",
  "Մ":"M","մ":"m","Յ":"Y","յ":"y","Ն":"N","ն":"n",
  "Շ":"Sh","շ":"sh","Չ":"Chʻ","չ":"chʻ","Պ":"P","պ":"p",
  "Ջ":"J","ջ":"j","Ռ":"Ṙ","ռ":"ṙ","Ս":"S","ս":"s",
  "Վ":"V","վ":"v","Տ":"T","տ":"t","Ր":"R","ր":"r",
  "Ց":"Tsʻ","ց":"tsʻ","Ւ":"W","ւ":"w","Փ":"Pʻ","փ":"pʻ",
  "Ք":"Kʻ","ք":"kʻ","Օ":"O","օ":"o","Ֆ":"F","ֆ":"f"
};

/* ============== LOC TRANSLITERATION ============== */

function transliterateLOC(text) {
  return text.split(/(\s+)/).map(word => {
    if (!word.trim()) return word;

    let result = "";
    let i = 0;

    // Initial Ե / Ո rules
    if (word[0] === "Ե") { result += "Ye"; i = 1; }
    else if (word[0] === "ե") { result += "ye"; i = 1; }
    else if (word[0] === "Ո") { result += "Vo"; i = 1; }
    else if (word[0] === "ո") { result += "vo"; i = 1; }

    while (i < word.length) {

      // Ու / ու digraph → U / u
      if (
        word[i] === "Ո" && word[i+1] === "ւ" ||
        word[i] === "ո" && word[i+1] === "ւ" ||
        word[i] === "Ու" ||
        word[i] === "ու"
      ) {
        result += (word[i] === "Ո" || word[i] === "Ու") ? "U" : "u";
        i += 2;
        continue;
      }

      result += locMap[word[i]] || word[i];
      i++;
    }

    return result;
  }).join("");
}

/* ============== SIMPLE MAP TRANSLITERATION ============== */

function transliterateSimple(text, map) {
  return text.split("").map(ch => map[ch] || ch).join("");
}

/* ================= OTHER MAPS ================= */

const maps = {

  hmb: {
    "Ա":"A","ա":"a","Բ":"B","բ":"b","Գ":"G","գ":"g",
    "Դ":"D","դ":"d","Ե":"E","ե":"e","Զ":"Z","զ":"z",
    "Է":"Ē","է":"ē","Ը":"Ə","ը":"ə","Թ":"Tʿ","թ":"tʿ",
    "Ժ":"Ž","ժ":"ž","Ի":"I","ի":"i","Լ":"L","լ":"l",
    "Խ":"X","խ":"x","Ծ":"C","ծ":"c","Կ":"K","կ":"k",
    "Հ":"H","հ":"h","Ձ":"J","ձ":"j","Ղ":"Ɣ","ղ":"ɣ",
    "Ճ":"Č","ճ":"č","Մ":"M","մ":"m","Յ":"Y","յ":"y",
    "Ն":"N","ն":"n","Շ":"Š","շ":"š","Ո":"O","ո":"o",
    "Չ":"Čʿ","չ":"čʿ","Պ":"P","պ":"p","Ջ":"ǰ","ջ":"ǰ",
    "Ռ":"Ṙ","ռ":"ṙ","Ս":"S","ս":"s","Վ":"V","վ":"v",
    "Տ":"T","տ":"t","Ր":"R","ր":"r","Ց":"Cʿ","ց":"cʿ",
    "Ւ":"W","ւ":"w","Փ":"Pʿ","փ":"pʿ","Ք":"Kʿ","ք":"kʿ",
    "Օ":"O","օ":"o","Ֆ":"F","ֆ":"f"
  },

  passport: {
    "Ա":"A","ա":"a","Բ":"B","բ":"b","Գ":"G","գ":"g",
    "Դ":"D","դ":"d","Ե":"E","ե":"e","Զ":"Z","զ":"z",
    "Է":"E","է":"e","Ը":"Y","ը":"y","Թ":"T","թ":"t",
    "Ժ":"ZH","ժ":"zh","Ի":"I","ի":"i","Լ":"L","լ":"l",
    "Խ":"KH","խ":"kh","Ծ":"TS","ծ":"ts","Կ":"K","կ":"k",
    "Հ":"H","հ":"h","Ձ":"DZ","ձ":"dz","Ղ":"GH","ղ":"gh",
    "Ճ":"CH","ճ":"ch","Մ":"M","մ":"m","Յ":"Y","յ":"y",
    "Ն":"N","ն":"n","Շ":"SH","շ":"sh","Ո":"O","ո":"o",
    "Չ":"CH","չ":"ch","Պ":"P","պ":"p","Ջ":"J","ջ":"j",
    "Ռ":"R","ռ":"r","Ս":"S","ս":"s","Վ":"V","վ":"v",
    "Տ":"T","տ":"t","Ր":"R","ր":"r","Ց":"TS","ց":"ts",
    "Ւ":"V","ւ":"v","Փ":"P","փ":"p","Ք":"K","ք":"k",
    "Օ":"O","օ":"o","Ֆ":"F","ֆ":"f"
  },

  ascii: {
    "Ա":"A","ա":"a","Բ":"B","բ":"b","Գ":"G","գ":"g",
    "Դ":"D","դ":"d","Ե":"E","ե":"e","Զ":"Z","զ":"z",
    "Է":"E","է":"e","Ը":"Y","ը":"y","Թ":"Th","թ":"th",
    "Ժ":"Zh","ժ":"zh","Ի":"I","ի":"i","Լ":"L","լ":"l",
    "Խ":"Kh","խ":"kh","Ծ":"Ts","ծ":"ts","Կ":"K","կ":"k",
    "Հ":"H","հ":"h","Ձ":"Dz","ձ":"dz","Ղ":"Gh","ղ":"gh",
    "Ճ":"Ch","ճ":"ch","Մ":"M","մ":"m","Յ":"Y","յ":"y",
    "Ն":"N","ն":"n","Շ":"Sh","շ":"sh","Ո":"O","ո":"o",
    "Չ":"Ch","չ":"ch","Պ":"P","պ":"p","Ջ":"J","ջ":"j",
    "Ռ":"R","ռ":"r","Ս":"S","ս":"s","Վ":"V","վ":"v",
    "Տ":"T","տ":"t","Ր":"R","ր":"r","Ց":"Ts","ց":"ts",
    "Ւ":"V","ւ":"v","Փ":"P","փ":"p","Ք":"K","ք":"k",
    "Օ":"O","օ":"o","Ֆ":"F","ֆ":"f"
  }
};

/* ================= UPDATE ================= */

function update() {
  const text = document.getElementById("input").value;
  document.getElementById("loc").innerText = transliterateLOC(text);
  document.getElementById("hmb").innerText = transliterateSimple(text, maps.hmb);
  document.getElementById("passport").innerText = transliterateSimple(text, maps.passport);
  document.getElementById("ascii").innerText = transliterateSimple(text, maps.ascii);
}
</script>

</body>
</html>
